<div class="table-wrap"><table><thead><tr><th>CHAMADO</th><th>CLIENTE</th><th>TÉCNICO</th><th>ESTADO</th><th><span class="sr-only">Ações</span></th></tr></thead><tbody>{% for row in rows %}<tr><td><small>#{{ '%04d'|format(row.id) }}</small><a class="table-title" href="{{ url_for('ticket_detail',record_id=row.id) }}">{{ row.titulo }}</a></td><td>{{ row.cliente }}</td><td>{{ row.tecnico }}</td><td><span class="badge {{ 'open' if row.status=='Aberto' else 'progress' if row.status=='Em andamento' else 'done' }}">{{ row.status }}</span></td><td><a class="text-link" href="{{ url_for('ticket_detail',record_id=row.id) }}">Ver detalhes →</a></td></tr>{% else %}<tr><td colspan="5"><div class="empty">Nenhum chamado encontrado.<br><small>Cadastre um chamado ou ajuste os filtros.</small></div></td></tr>{% endfor %}</tbody></table></div>
