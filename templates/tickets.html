{% extends 'base.html' %}{% block content %}<section class="intro"><div><h2>Seu atendimento, do início à solução.</h2><p>{{ rows|length }} chamado(s) encontrado(s).</p></div><a class="button" href="{{ url_for('ticket_form') }}">＋ Novo chamado</a></section><form class="filters panel" method="get"><div><label for="busca">Buscar título ou cliente</label><input id="busca" name="busca" value="{{ search }}" placeholder="O que você procura?"></div><div><label for="status">Estado</label><select id="status" name="status"><option value="">Todos os estados</option>{% for s in statuses %}<option {{ 'selected' if state==s }}>{{ s }}</option>{% endfor %}</select></div><div><label for="tecnico">Técnico</label><select id="tecnico" name="tecnico"><option value="">Todos os técnicos</option>{% for t in technicians %}<option value="{{ t.id }}" {{ 'selected' if technician==t.id|string }}>{{ t.nome }}</option>{% endfor %}</select></div><button class="button">Filtrar</button><a class="text-link" href="{{ url_for('tickets') }}">Limpar</a></form><section class="panel">{% include '_tickets.html' %}</section>{% endblock %}
