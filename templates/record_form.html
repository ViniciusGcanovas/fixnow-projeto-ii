{% extends 'base.html' %}{% block content %}<a class="back" href="{{ url_for('records',entity=entity) }}">← Voltar para {{ info.title|lower }}</a><section class="panel form-panel"><h2>Dados do {{ info.singular }}</h2><p>Todos os campos são obrigatórios.</p>{% include '_errors.html' %}<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}">{% for key,label,limit in info.fields %}<label for="{{ key }}">{{ label }}</label><input id="{{ key }}" name="{{ key }}" value="{{ data.get(key,'') }}" type="{{ 'email' if key=='email' else 'tel' if key=='telefone' else 'text' }}" maxlength="{{ limit }}" required>{% endfor %}<div class="form-actions"><a class="button secondary" href="{{ url_for('records',entity=entity) }}">Cancelar</a><button class="button">Salvar cadastro</button></div></form></section>{% endblock %}
